<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IR Portal Tracker</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{
  --bg:#f5f1ea;--surface:#fffdf9;--surface2:#f2ece2;--hover:#f8f3eb;--ink:#29241f;--muted:#6e665c;--faint:#9a9085;--line:#e6ded0;--line2:#d9cfbf;
  --accent:#b0512e;--accent-hover:#9b4526;--accent-ink:#fff;--accent-soft:#f7e6dd;
  --ok:#2c7442;--ok-soft:#e4f1e7;--warn:#94650a;--warn-soft:#fbf1d9;--bad:#b3261e;--bad-soft:#fbe5e2;--info:#2b5c86;--info-soft:#e3edf6;
  --focus:#5b3aa8;--focus-soft:#efe6fb;
  --radius:12px;--r-sm:8px;--shadow:0 1px 2px rgba(60,40,20,.05),0 1px 6px rgba(60,40,20,.04);--shadow-hover:0 2px 4px rgba(60,40,20,.07),0 6px 16px rgba(60,40,20,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1815;--surface:#24201c;--surface2:#2d2823;--hover:#2a2520;--ink:#efe8dc;--muted:#a99f92;--faint:#7d7469;--line:#37312b;--line2:#463f37;
  --accent:#e08159;--accent-hover:#eb926c;--accent-ink:#1b1815;--accent-soft:#3a2a21;
  --ok:#7cc592;--ok-soft:#1e3125;--warn:#e3b75a;--warn-soft:#382e1d;--bad:#f08a80;--bad-soft:#3b221f;--info:#8ab8e0;--info-soft:#1e2b37;
  --focus:#c3a8f2;--focus-soft:#2e2540;--shadow:none;--shadow-hover:0 0 0 1px var(--line2);}}
:root[data-theme="dark"]{--bg:#1b1815;--surface:#24201c;--surface2:#2d2823;--hover:#2a2520;--ink:#efe8dc;--muted:#a99f92;--faint:#7d7469;--line:#37312b;--line2:#463f37;--accent:#e08159;--accent-hover:#eb926c;--accent-ink:#1b1815;--accent-soft:#3a2a21;--ok:#7cc592;--ok-soft:#1e3125;--warn:#e3b75a;--warn-soft:#382e1d;--bad:#f08a80;--bad-soft:#3b221f;--info:#8ab8e0;--info-soft:#1e2b37;--focus:#c3a8f2;--focus-soft:#2e2540;--shadow:none;--shadow-hover:0 0 0 1px var(--line2)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{transition:background-color .12s,border-color .12s,color .12s,box-shadow .12s,transform .12s}
.num,td[style*="text-align:right"],.kpi .n{font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:6px;padding:10px 12px 6px}
.bar.wrap{flex-wrap:wrap;row-gap:6px}
.brand{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand .dot{width:24px;height:24px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.3px;flex:none}
.brand small{font-weight:500;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid transparent;background:transparent;border-radius:var(--r-sm);min-width:34px;height:34px;display:grid;place-items:center;cursor:pointer;padding:0 8px;color:var(--muted)}
.iconbtn:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
.iconbtn svg{width:18px;height:18px;display:block}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
@media(max-width:480px){.brand small{display:none}}
/* main tabs: one segmented control */
nav.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin:2px 12px 10px;padding:3px;background:var(--surface2);border-radius:10px}
nav.tabs button{border:0;background:transparent;padding:6px 6px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:650;min-height:34px;line-height:1.2;white-space:normal;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center;gap:2px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;margin-left:4px;line-height:1}
.badge.neutral{background:var(--faint)}
nav.tabs button[aria-current="page"] .badge{background:var(--bad);color:#fff}
:root[data-theme="dark"] .badge{color:#1b1815}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{color:#1b1815}}

main{padding:12px;max-width:1500px;margin:0 auto}
.cols{display:block}
@media(min-width:1000px){.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.3fr);gap:12px;align-items:start}.cols>div>.card:first-child{margin-top:0}}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px;overflow-x:auto}
.card h2{font-size:14.5px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:.1px}
.card h2 .sp{flex:1}
.card h2 .small,.card h2 .muted{font-weight:500}
h3{font-size:11.5px;font-weight:700;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.muted{color:var(--muted)} .small{font-size:12px}
.badText{color:var(--bad);font-weight:600} .warnText{color:var(--warn);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* buttons and fields */
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-sm);padding:7px 12px;min-height:36px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--hover);border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{background:var(--surface);border-color:var(--line2)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 2px;font-size:12.5px;border-radius:4px}
.linkbtn:hover{text-decoration:underline;text-underline-offset:2px}
input.fld,select.fld,textarea.fld{width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-sm);padding:7px 10px;min-height:36px}
input.fld:hover,select.fld:hover,textarea.fld:hover{border-color:var(--faint)}
input.fld::placeholder,textarea.fld::placeholder{color:var(--faint)}
textarea.fld{min-height:80px;resize:vertical}
input.fld:focus,select.fld:focus,textarea.fld:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn:focus-visible,button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.lbl{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600}
.chk input{width:16px;height:16px;accent-color:var(--accent)}

/* pills and messages */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:650;border:1px solid var(--line);background:var(--surface2);color:var(--ink);white-space:nowrap;line-height:1.5}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent} .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent} .pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent} .pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.focus{background:var(--focus-soft);color:var(--focus);border-color:transparent}
.pill.ok::before,.pill.warn::before,.pill.info::before,.pill.bad::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.msg{border-radius:var(--r-sm);padding:9px 12px;margin:8px 0;font-size:12.5px;border:1px solid transparent}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.warn{background:var(--warn-soft);color:var(--warn)} .msg.info{background:var(--info-soft);color:var(--info)}
.empty{color:var(--muted);text-align:center;padding:20px 8px;font-size:12.5px}

/* KPI tiles (each one opens the Worklist, filtered) */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{position:relative;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:11px 30px 11px 14px;cursor:pointer;text-align:left;box-shadow:var(--shadow);overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2)}
.kpi.bad::before{background:var(--bad)} .kpi.warn::before{background:var(--warn)} .kpi.info::before{background:var(--info)} .kpi.focus::before{background:var(--focus)}
.kpi::after{content:"→";position:absolute;right:12px;top:11px;color:var(--faint);font-weight:700;transition:transform .12s,color .12s}
.kpi:hover{border-color:var(--line2);box-shadow:var(--shadow-hover);transform:translateY(-1px)}
.kpi:hover::after{color:var(--accent);transform:translateX(2px)}
.kpi:active{transform:none}
.kpi .l{order:-1;font-size:12px;color:var(--muted);font-weight:650;line-height:1.3}
.kpi .n{font-size:26px;font-weight:750;line-height:1.15;letter-spacing:-.5px}
.kpi .small{font-size:11.5px;line-height:1.35}
.kpi.bad .n{color:var(--bad)} .kpi.warn .n{color:var(--warn)} .kpi.info .n{color:var(--info)} .kpi.focus .n{color:var(--focus)}
.kpi.zero .n{color:var(--faint)}

/* came-from-dashboard banner */
.fromdash{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r-sm);padding:6px 10px;margin:-2px 0 10px;font-size:12.5px}
.fromdash b{font-weight:700}

/* list rows (next to review, report sources, incident detail) */
.srow{border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0;background:var(--surface)}
.srow[data-act]:hover{background:var(--hover);border-color:var(--line2)}
.srow .name{font-weight:700}
.srow .meta{font-size:12px;color:var(--muted)}
.srow .line{margin-top:4px}

/* location blocks */
.loc{background:var(--surface2);border-radius:var(--radius);padding:10px 12px;margin:8px 0}
.loc>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;flex-wrap:wrap}
.loc>summary::-webkit-details-marker{display:none}
.loc>summary::after{content:"▸";margin-left:auto;color:var(--muted)} .loc[open]>summary::after{content:"▾"}
.loc .lname{font-weight:700}
.dline{display:grid;grid-template-columns:minmax(0,1fr) 120px 34px;gap:8px;align-items:center;padding:4px 2px;font-size:13px}
.dline .track{height:8px;border-radius:5px;background:var(--surface);overflow:hidden}
.dline .fillbar{height:100%;border-radius:5px;background:var(--accent)}
.dline .fillbar.nc{background:var(--muted)}
.dline .c{text-align:right;font-weight:700}
.dline.nc{color:var(--muted)}

/* tables */
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table.wl{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.wl th{position:sticky;top:0;z-index:1;background:var(--surface2);text-align:left;padding:8px 10px;font-size:11.5px;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px}
table.wl th button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;font-weight:700;text-transform:inherit;letter-spacing:inherit}
table.wl th button:hover{color:var(--ink)}
table.wl th button[aria-sort]{color:var(--accent)}
table.wl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.wl tbody tr[data-act]:hover td{background:var(--hover)}
table.wl tr.nc td{color:var(--muted)}
table.wl tr.grp td{background:var(--surface2);font-weight:700;color:var(--ink);font-size:12px;padding:6px 10px;position:sticky;top:33px;z-index:0}
.due-bad{color:var(--bad);font-weight:700} .due-warn{color:var(--warn);font-weight:700}
@media(max-width:640px){
  table.wl thead{display:none}
  table.wl,table.wl tbody,table.wl tr,table.wl td{display:block;width:100%}
  table.wl tr{border-bottom:1px solid var(--line);padding:8px 10px}
  table.wl tr.grp td{position:static}
  table.wl td{border:0;padding:1px 0;display:flex;gap:10px}
  table.wl td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:11.5px;min-width:84px}
}
.mini{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.mini th{text-align:left;color:var(--muted);font-weight:650;font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:bottom;line-height:1.25}
.mini .dc{display:flex;align-items:baseline;gap:2px}
.mini .dc .linkbtn:first-child{min-width:0}
.mini th{white-space:normal}
.mini.clin td:first-child{white-space:nowrap}
.mini td{padding:6px 6px;border-bottom:1px solid var(--line)}
.mini th{padding:6px 6px}
.mini tbody tr:hover td{background:var(--hover)}
.mini tr:last-child td{border-bottom:0}
.mini tr.total td{border-top:1px solid var(--line2);font-weight:700}
.mini .rn{opacity:0;padding:0 4px;font-size:12px;color:var(--faint)}
.mini tr:hover .rn,.mini .rn:focus-visible{opacity:1}
@media(hover:none){.mini .rn{opacity:.6}}

/* provider / clinic groups */
.grp{border-left:3px solid var(--line2)}
.grp.sent{border-left-color:var(--ok)} .grp.ready{border-left-color:var(--warn)} .grp.noemail{border-left-color:var(--bad)}
.grp .gh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grp .gname{font-weight:750;font-size:14.5px}
.sec{border-radius:10px;padding:8px 12px;margin-top:10px}
.sec.amber{background:var(--warn-soft)} .sec.blue{background:var(--info-soft)} .sec.gray{background:var(--surface2)}
.sec h4{margin:0 0 4px;font-size:12.5px}

/* sub navigation: segmented */
.subnav{display:inline-flex;gap:2px;flex-wrap:wrap;margin-bottom:12px;padding:3px;background:var(--surface2);border-radius:10px;max-width:100%}
.subnav button{border:0;background:transparent;border-radius:8px;padding:5px 12px;font-weight:650;color:var(--muted);cursor:pointer;min-height:30px;display:inline-flex;align-items:center}
.subnav button:hover{color:var(--ink)}
.subnav button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.subnav button .badge.neutral{background:var(--faint)}

/* clinic chips */
.wlbar{padding:10px 12px}

/* settings tables */
table.set{border-collapse:collapse;width:100%;font-size:13px}
table.set th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:6px;border-bottom:1px solid var(--line2)}
table.set td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.set input.fld,table.set select.fld{min-height:30px;padding:4px 8px}

/* modal, toast, busy */
#modal{position:fixed;inset:0;background:rgba(25,18,10,.42);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:4vh 10px;z-index:20;overflow:auto}
#modal[hidden]{display:none}
#modal .sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:880px;width:100%;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.22);animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.emailprev{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;color:#222;max-height:52vh;overflow:auto}
.hdrs{display:grid;grid-template-columns:70px minmax(0,1fr);gap:4px 8px;font-size:13px;margin-bottom:10px}
.hdrs b{color:var(--muted)}
.hdrs span{word-break:break-word}
iframe.print{width:100%;height:65vh;border:1px solid var(--line);border-radius:10px;background:#fff}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:30;max-width:92vw}
#toast .msg{box-shadow:0 6px 20px rgba(0,0,0,.15);border-color:var(--line)}
#busy{position:fixed;inset:0;display:grid;place-items:center;background:rgba(245,241,234,.65);backdrop-filter:blur(1px);z-index:25;font-weight:700}
:root[data-theme="dark"] #busy{background:rgba(20,16,12,.65);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #busy{background:rgba(20,16,12,.65);color:var(--ink)}}
#busy[hidden]{display:none}
.demo-ribbon{background:var(--info-soft);color:var(--info);text-align:center;font-size:11.5px;font-weight:650;padding:4px 8px}
/* clinic multi-select dropdown */
.ms{position:relative;display:inline-block;min-width:0;max-width:100%}
.ms-btn{display:flex;align-items:center;gap:10px;min-width:220px;max-width:100%;min-height:34px;padding:5px 10px 5px 12px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;font-weight:650;text-align:left}
.ms-btn:hover{border-color:var(--faint)}
.ms.open .ms-btn{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ms-btn.empty .ms-val{color:var(--bad)}
.ms-val{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-caret{color:var(--muted);font-size:11px;transition:transform .12s}
.ms.open .ms-caret{transform:rotate(180deg)}
.ms-pop{position:absolute;z-index:15;top:calc(100% + 4px);left:0;width:max(100%,260px);max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.16);animation:pop .12s ease-out}
.ms-acts{display:flex;gap:14px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.ms-acts .linkbtn{white-space:nowrap}
.ms-acts .linkbtn:disabled{color:var(--faint);cursor:default;text-decoration:none}
.ms-list{max-height:min(320px,50vh);overflow:auto;padding:4px}
.ms-opt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:7px 8px;border-radius:6px;cursor:pointer;text-align:left;font-weight:550}
.ms-opt:hover{background:var(--hover)}
.ms-box{width:16px;height:16px;border:1.5px solid var(--faint);border-radius:4px;display:grid;place-items:center;flex:none;background:var(--surface)}
.ms-opt[aria-checked="true"] .ms-box{background:var(--accent);border-color:var(--accent)}
.ms-opt[aria-checked="true"] .ms-box::after{content:"";width:8px;height:4px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.ms-n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ms-foot{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.card.wlbar{overflow:visible}
.card:has(.ms.open){overflow:visible}
/* segmented buttons (Settings) */
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface2);border-radius:10px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 12px;font-weight:650;color:var(--muted);cursor:pointer;min-height:30px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
/* collapsible groups (Collapse by MRN / Description) */
tr.cgrp td{background:var(--surface2);padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
tr.cgrp:hover td{background:var(--hover)}
tr.cgrp:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cg-caret{color:var(--muted);font-size:11px;width:10px;transition:transform .12s}
tr.cgrp.open .cg-caret{transform:rotate(90deg)}
.cg-n{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:750;font-variant-numeric:tabular-nums}
.cg-l{min-width:0}

<body>
<div id="app"></div>

<script>
'use strict';
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const norm = s => String(s ?? '').trim().toLowerCase().replace(/\s+/g, ' ');
const wlValid = v => v && (v.mode === 'all' || (v.mode === 'some' && Array.isArray(v.list)));
function wlDefault(){ try { const v = JSON.parse(localStorage.getItem('irWlDefault') || 'null'); return wlValid(v) ? v : { mode: 'all' }; } catch { return { mode: 'all' }; } }
// opens on the last selection; the first time (or after it's cleared) on the user's default from Settings, else all clinics
function wlLoadSafe(){ try { const v = JSON.parse(localStorage.getItem('irWlClinics') || 'null'); return wlValid(v) ? v : wlDefault(); } catch { return { mode: 'all' }; } }
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const ICON_GEAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
const ICON_REFRESH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>';
// light / dark: follows the computer until someone picks one; remembered on this computer
function themePref(){ try { return localStorage.getItem('irTheme') || ''; } catch { return ''; } }

const isDark = () => { const t = themePref(); return t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); };
applyTheme();
const startTab = () => { try { return localStorage.getItem('irStart') === 'rep' ? 'rep' : 'dash'; } catch { return 'dash'; } };
const S = { ...wvLoad(), open: new Set(), wl: wlLoadSafe(), allTypes: (() => { try { return localStorage.getItem('irAll') === '1'; } catch { return false; } })(), notes: {}, sidx: {}, loc: (() => { try { return localStorage.getItem('irLoc') || ''; } catch { return ''; } })(), tab: startTab(), rows: [], cfg: null, sent: {}, f: { q: '', fac: '', prov: '', desc: '', nc: false, due: '', st: '', fk: '' }, sort: null, sigView: 'open', clinView: 'open', loadErr: '' };

// Columns are found by header name, so moving or inserting columns in the Filtered tab doesn't break anything.
const COLS = {
  id: ['incident id', 'incident'], last: ['last name', 'last'], first: ['first name', 'first'], gender: ['gender', 'sex'], dob: ['dob', 'date of birth'],
  desc: ['description', 'description option', 'description type'], org: ['prov org', 'provider org', 'provider organization'], fac: ['facility', 'location'],
  mrn: ['mrn'], dos: ['dos', 'date of service'], prov: ['provider', 'rendering provider'], act: ['last activity'], due: ['due date', 'due'], entry: ['entry date', 'entered'],
};
const NEED = ['desc', 'fac', 'mrn', 'prov'];
const LABEL = { id:'Incident ID', last:'Last Name', first:'First Name', gender:'Gender', dob:'DOB', desc:'Description', org:'Prov Org', fac:'Facility', mrn:'MRN', dos:'DOS', prov:'Provider', act:'Last Activity', due:'Due Date', entry:'Entry Date' };

function toDate(v){
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : new Date(v.getFullYear(), v.getMonth(), v.getDate());
  if (typeof v === 'number' && v > 20000 && v < 80000) return new Date(1899, 11, 30 + Math.floor(v));
  const t = String(v).trim(); let m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m){ let y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[1] - 1, +m[2]); }
  m = t.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  return null;
}
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const days = (a, b) => Math.round((a - b) / 864e5);
const fmtD = d => d ? `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}` : '';
const fmtShort = d => `${d.getMonth() + 1}.${d.getDate()}.${String(d.getFullYear()).slice(-2)}`;
const codify = (last, first) => (String(last || '').replace(/[^A-Za-z]/g, '').slice(0, 3) + String(first || '').replace(/[^A-Za-z]/g, '').slice(0, 3)).toUpperCase();
const CREDS = /\b(md|do|np|pmhnp|pmhnp-bc|fnp|fnp-c|pa|pa-c|lcsw|lmft|psyd|phd|rn|aprn|bc|mph|dnp)\b\.?/gi;
function firstName(prov){
  let p = String(prov || '').replace(CREDS, '').replace(/[.,]+\s*$/, '').trim();
  if (p.includes(',')) p = p.split(',')[1] || '';
  else { const t = p.split(/\s+/); if (t.length >= 2 && p === p.toUpperCase()) p = t[1]; } // portal style: LAST FIRST
  const tok = p.trim().split(/\s+/)[0] || '';
  return tok ? tok[0].toUpperCase() + tok.slice(1).toLowerCase() : '';
}
const splitEmails = s => String(s || '').split(/[;,\s]+/).map(x => x.trim()).filter(x => /@/.test(x));
const uniq = arr => { const seen = new Set(); return arr.filter(x => { const k = x.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }); };

// ---------- settings ----------
const DEFAULTS = {
  sheet: 'auto',
  ctrl: {},        // description -> false when NOT controllable (anything unlisted counts as controllable)
  route: {},       // description -> 'provider' | 'clinic' | 'none'
  providers: {},   // provider name -> { email, greet, sup, leader }
  clinics: {},     // facility -> { email, leader }
  ccAlways: '', ccClinic: '', supDefault: '', signoff: '',
  codify: true, rename: {},
  rptTo: 'PracticeLeadersSummit@mymhs.com; PracticeLeadersCoastal@mymhs.com; mbaxter@mymhs.com', rptCc: 'bgonzalez@mymhs.com; kmcleod@mymhs.com', rptSubject: 'IR Portal',
  erIntro: 'Auths! Please see the Filtered tabs on the attached document to see our outstanding non-interventional auth related items.', erKeep: null, irDecide: {},
  provIntro: 'The following encounters have been identified as pending signature in the billing portal. Could you please complete sign off on these this week?',
  clinicIntro: 'The following items in the billing portal need clinic follow-up. Could you please work through these this week?',
  disclaimer: 'CONFIDENTIALITY NOTICE: This message and any attachments may contain protected health information (PHI) that is privileged and confidential under HIPAA and applicable state law. It is intended only for the individual(s) named above. If you are not the intended recipient, you are notified that any review, use, disclosure, copying or distribution of this message is prohibited. If you received this message in error, please notify the sender immediately and delete it.',
};
function defaultRoute(desc){
  const d = norm(desc);
  if (/signature|unsigned/.test(d)) return 'provider';
  return 'clinic'; // incomplete charts, missing treatment reports, ER/HIM/NB registration items, anything new
}
const routeOf = desc => S.cfg.route[desc] || defaultRoute(desc);
const AUTH_CAT = 'ER/HIM/NB/Authorization Missing';
const isCtrl = desc => desc === AUTH_CAT ? S.cfg.ctrl[desc] === true : S.cfg.ctrl[desc] !== false; // auth is off unless switched on in Settings
const inView = r => S.allTypes || isCtrl(r.desc);
// status + notes, one per incident; the most recent save wins and is copied to every day-part tab
const STATUSES = ['Needs review', 'Reviewed', 'Submitted'];
const noteRec = id => S.notes[String(id)] || null;
const noteOf = id => (noteRec(id) || {}).note || '';
const statusOf = id => { const n = noteRec(id); return n && STATUSES.includes(n.status) ? n.status : (n && n.note ? 'Reviewed' : 'Needs review'); };
const isRegistration = desc => /^er\/him\/nb/i.test(String(desc).trim());

function loadCfg(){
  let c = S.store.getDoc('irCfg');
  if (!c){ try { c = JSON.parse(localStorage.getItem('irCfg') || 'null'); } catch { c = null; } }
  S.cfg = Object.assign({}, DEFAULTS, c || {});
  for (const k of ['ctrl', 'route', 'providers', 'clinics', 'irDecide', 'rename']) S.cfg[k] = Object.assign({}, S.cfg[k]);
  S.sent = S.store.getDoc('irSent') || {};
}
async function saveCfg(){
  try { localStorage.setItem('irCfg', JSON.stringify(S.cfg)); } catch {}
  await S.store.setDoc('irCfg', S.cfg);
}
async function markSent(key){ S.sent[key] = new Date().toISOString(); await S.store.setDoc('irSent', S.sent); }
const sentOn = key => S.sent[key] ? new Date(S.sent[key]) : null;
const sentFresh = key => { const d = sentOn(key); return d && days(today(), new Date(d.getFullYear(), d.getMonth(), d.getDate())) < 7; };

// ---------- data ----------
function parse(values, sheet){
  let hi = findHeader(values, ['incident id', 'description', 'facility']); if (hi < 0) hi = 0;
  const hdr = (values[hi] || []).map(norm);
  const at = {}; const missing = [];
  for (const [k, names] of Object.entries(COLS)){ const i = hdr.findIndex(h => names.includes(h)); if (i >= 0) at[k] = i; }
  const iSt = hdr.indexOf('status'), iNo = hdr.indexOf('notes');
  for (const k of NEED) if (at[k] === undefined) missing.push(LABEL[k]);
  const rows = [];
  if (!missing.length){
    for (let r = hi + 1; r < values.length; r++){
      const v = values[r]; const g = k => at[k] === undefined ? '' : v[at[k]];
      if (!v.some(x => x !== '' && x !== null)) continue;
      const raw = String(g('desc') ?? '').trim(); const c = classifyIR(raw);
      const o = {
        r, id: String(g('id') ?? '').trim(), last: String(g('last') ?? '').trim(), first: String(g('first') ?? '').trim(), gender: String(g('gender') ?? '').trim(),
        dob: toDate(g('dob')), raw, desc: (c.outlier ? dispCat(c.key) : c.cat) || '(No description)', org: String(g('org') ?? '').trim(), fac: normLoc(g('fac')),
        mrn: String(g('mrn') ?? '').trim(), dos: toDate(g('dos')), prov: String(g('prov') ?? '').trim() || '(No provider)', act: g('act'), due: toDate(g('due')), entry: toDate(g('entry')),
        sheetStatus: iSt >= 0 ? String(v[iSt] ?? '').trim() : '', sheetNote: iNo >= 0 ? String(v[iNo] ?? '').trim() : '',
      };
      o.code = codify(o.last, o.first); o.name = [o.last, o.first].filter(Boolean).join(', ');
      o.age = o.dos ? days(today(), o.dos) : null; o.dueIn = o.due ? days(o.due, today()) : null; o.agecat = ageCat(o.age); o.agecatL = AGE_CATS[o.agecat];
      rows.push(o);
    }
  }
  return { rows, missing, sheet, found: Object.keys(at).length };
}
const ORDER = ['fac', 'prov', 'mrn', 'desc']; // location → provider → MRN → description type
function cmp(a, b, k){
  const x = a[k], y = b[k];
  if (x instanceof Date || y instanceof Date){ return (x ? x.getTime() : Infinity) - (y ? y.getTime() : Infinity); }
  if (typeof x === 'number' || typeof y === 'number' || x === null || y === null) return (x ?? Infinity) - (y ?? Infinity);
  if (k === 'mrn' && /^\d+$/.test(x) && /^\d+$/.test(y)) return Number(x) - Number(y);
  return String(x).localeCompare(String(y), undefined, { sensitivity: 'base', numeric: true });
}
// age category from days since DOS
const AGE_CATS = ['0–30 days', '31–60 days', '61–90 days', '91+ days', 'No DOS'];
const ageCat = a => a === null || a === undefined ? 4 : a <= 30 ? 0 : a <= 60 ? 1 : a <= 90 ? 2 : 3;
// Worklist view: Sort preset and Collapse by, remembered on this computer
const WSORTS = { dos: ['DOS (newest first)', [['dos', -1], ['mrn', 1]]], dosOld: ['DOS (oldest first)', [['dos', 1], ['mrn', 1]]], due: ['Due date', [['due', 1], ['dos', -1]]],
  agecat: ['Age category (most aged first)', [['agecat', -1], ['dos', 1]]], desc: ['Description', [['desc', 1], ['dos', -1]]], mrn: ['MRN, then DOS', [['mrn', 1], ['dos', -1]]] };
function wvLoad(){ try { const v = JSON.parse(localStorage.getItem('irWlView') || 'null') || {}; return { wsort: ['dos', 'dosOld', 'due', 'agecat', 'desc', 'mrn'].includes(v.wsort) ? v.wsort : '', collapse: ['mrn', 'desc'].includes(v.collapse) ? v.collapse : '' }; } catch { return { wsort: '', collapse: '' }; } }
function wvSave(){ try { localStorage.setItem('irWlView', JSON.stringify({ wsort: S.wsort, collapse: S.collapse })); } catch {} }
const wsortNow = () => S.wsort || (S.collapse ? 'dos' : '');
function sorted(rows){
  const ws = !S.sort && wsortNow();
  if (ws){ const ks = WSORTS[ws][1]; return rows.slice().sort((a, b) => { for (const [k, d] of ks){ const x = a[k] ?? null, y = b[k] ?? null; if (x === null && y !== null) return 1; if (y === null && x !== null) return -1; const c = cmp(a, b, k) * d; if (c) return c; } for (const k of ORDER){ const c = cmp(a, b, k); if (c) return c; } return 0; }); }
  const keys = S.sort ? [S.sort.k, ...ORDER.filter(k => k !== S.sort.k)] : ORDER; const dir = S.sort ? S.sort.d : 1;
  return rows.slice().sort((a, b) => { for (let i = 0; i < keys.length; i++){ const c = cmp(a, b, keys[i]) * (i === 0 ? dir : 1); if (c) return c; } return 0; });
}
// Worklist clinic picker: { mode: 'all' } or { mode: 'some', list: [...] }, remembered on this computer
const WL_TABS = ['work', 'sig', 'clinic'];
function wlSave(){ try { localStorage.setItem('irWlClinics', JSON.stringify(S.wl)); } catch {} }
const wlOn = () => WL_TABS.includes(S.tab) && !S.loc && S.wl && S.wl.mode === 'some';
const wlHas = f => !wlOn() || S.wl.list.includes(f);
const scope = () => S.loc ? S.rows.filter(r => r.fac === S.loc) : wlOn() ? S.rows.filter(r => S.wl.list.includes(r.fac)) : S.rows; // header location, or the Worklist clinic picker
function wlLabel(){ if (S.loc) return S.loc; if (!wlOn()) return 'All locations'; const l = S.wl.list; return !l.length ? 'No clinics' : l.length <= 3 ? l.join(', ') : `${l.length} clinics`; }
// multi-select clinic dropdown. k = 'wl' (Worklist, last selection) or 'def' (Settings default)
const msFacs = () => [...groupBy(S.rows.filter(inView), 'fac').entries()].sort((a, b) => byName(a[0], b[0]));
const msGet = k => k === 'def' ? wlDefault() : (S.wl || { mode: 'all' });
function msSet(k, v){
  if (k === 'def'){ try { localStorage.setItem('irWlDefault', JSON.stringify(v)); } catch {} }
  else { S.wl = v; wlSave(); }
}
function msSummary(v, facs){
  if (v.mode === 'all') return `All clinics (${facs.length})`;
  const l = v.list.filter(f => facs.some(([x]) => x === f));
  return !l.length ? 'No clinics selected' : l.length <= 2 ? l.join(', ') : `${l.length} of ${facs.length} clinics`;
}
function msHTML(k){
  const facs = msFacs(); const v = msGet(k); const all = v.mode === 'all'; const sel = f => all || v.list.includes(f);
  const nSel = facs.filter(([f]) => sel(f)).length; const open = S.msOpen === k;
  const def = wlDefault(); const same = (x, y) => x.mode === y.mode && (x.mode === 'all' || [...x.list].sort().join('|') === [...y.list].sort().join('|'));
  return `<div class="ms${open ? ' open' : ''}" data-ms="${k}">
    <button class="ms-btn${nSel ? '' : ' empty'}" data-act="msOpen" data-k="${k}" aria-haspopup="true" aria-expanded="${open}"><span class="ms-val">${esc(msSummary(v, facs))}</span><span class="ms-caret" aria-hidden="true">▾</span></button>
    ${open ? `<div class="ms-pop" role="group" aria-label="Clinics">
      <div class="ms-acts"><button class="linkbtn" data-act="msAll" data-k="${k}" ${all ? 'disabled' : ''}>Select all</button><button class="linkbtn" data-act="msNone" data-k="${k}" ${!nSel ? 'disabled' : ''}>Deselect all</button>
        ${k === 'wl' && !same(v, def) ? `<span class="grow"></span><button class="linkbtn" data-act="msDefault" data-k="${k}" title="Your default from Settings">My default</button>` : ''}</div>
      <div class="ms-list">${facs.map(([f, rs]) => `<button class="ms-opt" role="menuitemcheckbox" aria-checked="${sel(f)}" data-act="msToggle" data-k="${k}" data-f="${esc(f)}"><span class="ms-box" aria-hidden="true"></span><span class="grow">${esc(f)}</span><span class="ms-n">${rs.length}</span></button>`).join('') || '<div class="empty">No clinics on this tab.</div>'}</div>
      <div class="ms-foot"><span class="small muted">${nSel} of ${facs.length} selected</span><span class="grow"></span><button class="btn sm primary" data-act="msClose">Done</button></div>
    </div>` : ''}</div>`;
}
function wlBar(){
  const chip = (f, act) => `<span class="selchip">${esc(f)}<button data-act="${act}" data-f="${act === 'setLoc' ? '' : esc(f)}" aria-label="Remove ${esc(f)}" title="Remove">×</button></span>`;
  if (S.loc) return `<div class="card noprint wlbar"><div class="row"><b>Clinics</b>${chip(S.loc, 'setLoc')}<span class="small muted">from the Location picker at the top. Remove it to use your clinic selection.</span></div></div>`;
  const facs = msFacs(); const v = msGet('wl'); const picked = v.mode === 'all' ? [] : facs.map(([f]) => f).filter(f => v.list.includes(f)); const nSel = v.mode === 'all' ? facs.length : picked.length;
  return `<div class="card noprint wlbar"><div class="row"><b>Clinics</b>${msHTML('wl')}${picked.length ? `<div class="selchips">${picked.map(f => chip(f, 'msRemove')).join('')}${picked.length > 1 ? '<button class="linkbtn" data-act="msAll" data-k="wl">Clear (all clinics)</button>' : ''}</div>` : ''}</div>
    ${!nSel ? '<div class="small badText" style="margin-top:6px">No clinics selected. Pick at least one to see items.</div>' : ''}</div>`;
}
const viewRows = () => scope().filter(inView);
const ctrlRows = () => viewRows().filter(r => statusOf(r.id) !== 'Submitted'); // outreach lists skip submitted items
function setLoc(v){ S.loc = v; try { localStorage.setItem('irLoc', v); } catch {} S.f.fac = ''; render(); window.scrollTo(0, 0); }
const sentKey = (kind, name) => kind + ':' + name + (kind === 'p' && S.loc ? '|' + S.loc : '');
const groupBy = (rows, k) => { const m = new Map(); for (const r of rows){ if (!m.has(r[k])) m.set(r[k], []); m.get(r[k]).push(r); } return m; };
const byName = (a, b) => String(a).localeCompare(String(b), undefined, { sensitivity: 'base' });

// ---------- stores ----------
function OfficeStore(){
  return {
    live: true,
    async load(sheet){
      const names = await Excel.run(async ctx => { const wss = ctx.workbook.worksheets; wss.load('items/name'); await ctx.sync(); return wss.items.map(w => w.name); });
      const pick = names.find(n => n === sheet) || names.find(n => norm(n) === norm(sheet));
      if (!pick) return { values: null, sheets: names, sheet };
      return { values: await this.readSheet(pick), sheets: names, sheet: pick };
    },
    getDoc(k){ try { return Office.context.document.settings.get(k); } catch { return null; } },
    setDoc(k, v){ return new Promise(res => { try { Office.context.document.settings.set(k, v); Office.context.document.settings.saveAsync(() => res()); } catch { res(); } }); },
    // every tab's name, row count and first rows (to recognise IR / ER exports)
    async sheetsInfo(){
      return Excel.run(async ctx => {
        const wss = ctx.workbook.worksheets; wss.load('items/name'); await ctx.sync();
        const urs = wss.items.map(ws => { const u = ws.getUsedRangeOrNullObject(true); u.load('rowCount,columnCount,rowIndex,columnIndex'); return u; }); await ctx.sync();
        const tops = wss.items.map((ws, i) => { const u = urs[i]; if (u.isNullObject) return null; const r = ws.getRangeByIndexes(u.rowIndex, u.columnIndex, Math.min(8, u.rowCount), Math.min(80, u.columnCount)); r.load('values'); return r; }); await ctx.sync();
        return wss.items.map((ws, i) => ({ name: ws.name, rows: urs[i].isNullObject ? 0 : urs[i].rowCount, top: tops[i] ? tops[i].values : [] }));
      });
    },
    // whole used range, read in chunks so big exports stay under Excel's request size limit
    async readSheet(name){
      return Excel.run(async ctx => {
        const ws = ctx.workbook.worksheets.getItem(name); const u = ws.getUsedRangeOrNullObject(true); u.load('rowCount,columnCount,rowIndex,columnIndex'); await ctx.sync();
        if (u.isNullObject) return [];
        // always from A1, so row/column positions match the sheet
        const nr = u.rowIndex + u.rowCount, nc = u.columnIndex + u.columnCount;
        const out = []; const step = Math.max(200, Math.floor(90000 / nc));
        for (let r = 0; r < nr; r += step){ const rg = ws.getRangeByIndexes(r, 0, Math.min(step, nr - r), nc); rg.load('values'); await ctx.sync(); for (const row of rg.values) out.push(row); }
        return out;
      });
    },
    async writeCells(sheet, cells, checks){
      return Excel.run(async ctx => {
        const ws = ctx.workbook.worksheets.getItem(sheet);
        const ck = (checks || []).map(c => { const r = ws.getCell(c.r, c.c); r.load('values'); return [r, c.v]; }); await ctx.sync();
        for (const [r, v] of ck) if (String(r.values[0][0]).trim() !== String(v).trim()) return false; // rows moved: caller re-indexes
        for (const c of cells) ws.getCell(c.r, c.c).values = [[c.v]];
        await ctx.sync(); return true;
      });
    },
    async refreshPivots(){ return Excel.run(async ctx => { ctx.workbook.pivotTables.refreshAll(); await ctx.sync(); }); },
    async insertCols(sheet, n){ return Excel.run(async ctx => { ctx.workbook.worksheets.getItem(sheet).getRange('A:' + String.fromCharCode(64 + n)).insert(Excel.InsertShiftDirection.right); await ctx.sync(); }); },
    async removeSheets(names){
      return Excel.run(async ctx => { const its = names.map(n => ctx.workbook.worksheets.getItemOrNullObject(n)); await ctx.sync(); its.forEach(w => { if (!w.isNullObject) w.delete(); }); await ctx.sync(); });
    },
    async writeSheet(name, values, opts = {}){
      return Excel.run(async ctx => {
        const old = ctx.workbook.worksheets.getItemOrNullObject(name); await ctx.sync(); if (!old.isNullObject){ old.delete(); await ctx.sync(); }
        const ws = ctx.workbook.worksheets.add(name); const c0 = opts.col || 0; const w = values[0].length; const step = Math.max(200, Math.floor(60000 / w));
        for (let r = 0; r < values.length; r += step){ const part = values.slice(r, r + step); ws.getRangeByIndexes(r, c0, part.length, w).values = part; await ctx.sync(); }
        if (values.length > 1) for (const c of opts.dateCols || []) ws.getRangeByIndexes(1, c0 + c, values.length - 1, 1).numberFormat = Array.from({ length: values.length - 1 }, () => ['m/d/yyyy']);
        if (opts.table){ const t = ws.tables.add(ws.getRangeByIndexes(0, c0, Math.max(2, values.length), w), true); t.name = opts.table; t.style = 'TableStyleLight9'; }
        else ws.getRangeByIndexes(0, c0, 1, w).format.font.bold = true;
        ws.freezePanes.freezeRows(1);
        if (opts.after){ const a = ctx.workbook.worksheets.getItemOrNullObject(opts.after); a.load('position'); await ctx.sync(); if (!a.isNullObject) ws.position = a.position + 1; }
        ws.getRangeByIndexes(0, c0, Math.min(values.length, 400), w).format.autofitColumns();
        await ctx.sync();
      });
    },
    async buildPivots(sheet, specs, opts = {}){
      if (!Office.context.requirements.isSetSupported('ExcelApi', '1.8')) throw new Error('PivotTables need a newer Excel');
      return Excel.run(async ctx => {
        let ws;
        if (opts.existing) ws = ctx.workbook.worksheets.getItem(sheet);
        else { const old = ctx.workbook.worksheets.getItemOrNullObject(sheet); await ctx.sync(); if (!old.isNullObject){ old.delete(); await ctx.sync(); } ws = ctx.workbook.worksheets.add(sheet); }
        await ctx.sync();
        for (const sp of specs){
          const pt = ws.pivotTables.add(sp.name, ctx.workbook.tables.getItem(sp.table), ws.getRange(sp.at));
          for (const f of sp.rows) pt.rowHierarchies.add(pt.hierarchies.getItem(f));
          for (const f of sp.cols || []) pt.columnHierarchies.add(pt.hierarchies.getItem(f));
          const dh = pt.dataHierarchies.add(pt.hierarchies.getItem(sp.value)); dh.summarizeBy = Excel.AggregationFunction.count;
          await ctx.sync();
          try { dh.name = sp.valueName; await ctx.sync(); } catch {}
          if (sp.sortDesc){ try { pt.rowHierarchies.getItem(sp.rows[0]).fields.getItem(sp.rows[0]).sortByValues(Excel.SortBy.descending, dh); await ctx.sync(); } catch {} }
        }
      });
    },
    async renameSheet(from, to){ return Excel.run(async ctx => { const t = ctx.workbook.worksheets.getItemOrNullObject(to); await ctx.sync(); if (!t.isNullObject){ t.delete(); await ctx.sync(); } ctx.workbook.worksheets.getItem(from).name = to; await ctx.sync(); }); },
    async activate(name){ return Excel.run(async ctx => { const w = ctx.workbook.worksheets.getItemOrNullObject(name); await ctx.sync(); if (!w.isNullObject){ w.activate(); await ctx.sync(); } }); },
    watch(cb){
      Excel.run(async ctx => { ctx.workbook.worksheets.onChanged.add(() => { cb(); return Promise.resolve(); }); await ctx.sync(); }).catch(() => {});
    },
  };
}

async function reload(quiet){
  if (!quiet) busy(true);
  try {
    if (!S.cfg) loadCfg();
    try { await scanSources(); } catch (e){ console.error(e); }
    const auto = !S.cfg.sheet || ['auto', 'filtered'].includes(norm(S.cfg.sheet));
    const latest = S.rep && (S.rep.ir.EOD || S.rep.ir.Noon || S.rep.ir.AM);
    const d = await S.store.load(auto ? (latest ? latest.sheet : 'Filtered') : S.cfg.sheet);
    if (S.store.remote) loadCfg(); // full-screen window: use the panel's saved settings
    S.notes = Object.assign({}, S.store.getDoc('irNotes') || {});
    S.sheets = d.sheets || [];
    if (!d.values){ S.loadErr = auto ? 'There\'s no IR Portal export or Filtered tab in this workbook yet.' : `There's no tab named "${S.cfg.sheet}" in this workbook.`; S.rows = []; S.missing = []; }
    else { const p = parse(d.values, d.sheet); S.rows = p.rows; S.missing = p.missing;
      for (const r of S.rows) if (r.id && !S.notes[r.id] && (r.sheetNote || STATUSES.includes(r.sheetStatus))) S.notes[r.id] = { note: r.sheetNote, status: STATUSES.includes(r.sheetStatus) ? r.sheetStatus : '', at: null }; // typed straight into A/B
      S.loadErr = p.missing.length ? `The "${d.sheet}" tab is missing these headers: ${p.missing.join(', ')}.` : ''; S.sheetName = d.sheet; }
    if ((S.cfg.dir || []).length && S.rows.some(r => r.prov && !(S.cfg.providers[r.prov] || {}).dirNote && !(S.cfg.providers[r.prov] || {}).dirName)){ applyDirectory(); try { await saveCfg(); } catch {} }
    S.loadedAt = new Date();
  } catch (e){ S.loadErr = e.message || String(e); }
  finally { busy(false); render(); }
}

function renameCheck(){

async function renameApply(oldN, newN){
  const m = Object.assign({}, S.cfg.rename); const wasCtrl = isCtrl(oldN), wasRoute = routeOf(oldN); const merge = S.rows.some(r => r.desc === newN);
  const originals = new Set([oldN, ...Object.keys(m).filter(k => dispCat(k) === oldN), ...IR_CATS.filter(k => dispCat(k) === oldN), AUTH_CAT].filter(k => dispCat(k) === oldN));
  for (const k of originals) m[k] = newN;
  for (const k of Object.keys(m)) if (m[k] === k) delete m[k];
  S.cfg.rename = m;
  if (!merge){ S.cfg.ctrl = Object.assign({}, S.cfg.ctrl, { [newN]: wasCtrl }); S.cfg.route = Object.assign({}, S.cfg.route, { [newN]: wasRoute }); }
  delete S.cfg.ctrl[oldN]; delete S.cfg.route[oldN];
  await saveCfg(); S.irCache = null; S.erCache = null;
  let changed = 0;
  busy(true, 'Renaming on the Filtered tabs…');
  try {
    for (const P of PARTS){ if (!(S.rep && S.rep.has(P.filtered))) continue; changed += await renameInSheet(P.filtered, oldN, newN); }
    if (changed) try { await S.store.refreshPivots(); } catch (e){ console.error(e); }
  } catch (e){ console.error(e); toast('warn', 'Renamed in the add-in, but couldn\'t update a Filtered tab: ' + esc(e.message || e)); }
  busy(false); await reload(true);
  toast('ok', `Renamed to "${esc(newN)}"${changed ? `, ${changed} cells updated on Filtered tabs` : ''}.`);
}
async function renameInSheet(sheet, oldN, newN){
  const v = await S.store.readSheet(sheet); const hi = findHeader(v, ['incident id', 'description', 'facility']); if (hi < 0) return 0;
  const c = v[hi].map(norm).indexOf('description'); const cells = [];
  for (let r = hi + 1; r < v.length; r++) if (String(v[r][c] ?? '').trim().replace(/\.$/, '') === oldN) cells.push({ r, c, v: newN });
  if (cells.length) await S.store.writeCells(sheet, cells, []);
  return cells.length;
}

}

const DIR_LOC = { 'san francisco': 'Post', 'san francisco - castro': 'Castro Street', 'roseville - sierra college': 'Sierra College', 'oakland iv': 'Oakland', 'remote': '', 'southern california': '' };
const dirClinic = g => { const k = norm(g); return k in DIR_LOC ? DIR_LOC[k] : String(g ?? '').trim(); };
const NICK = {ROB:'ROBERT',BOB:'ROBERT',KIM:'KIMBERLY',JOSH:'JOSHUA',BEN:'BENJAMIN',TOBY:'TOBIAS',VANGIE:'EVANGELINE',JAZ:'JAZMYNE',BEX:'REBECCA',LIZ:'ELIZABETH',BETH:'ELIZABETH',KATE:'KATHERINE',KATIE:'KATHERINE',MIKE:'MICHAEL',JIM:'JAMES',BILL:'WILLIAM',WILL:'WILLIAM',TOM:'THOMAS',DAN:'DANIEL',DAVE:'DAVID',SAM:'SAMUEL',ALEX:'ALEXANDER',CHRIS:'CHRISTOPHER',MATT:'MATTHEW',NICK:'NICHOLAS',TONY:'ANTHONY',STEVE:'STEVEN',ANDY:'ANDREW',JEN:'JENNIFER',JENNY:'JENNIFER',MEG:'MARGARET',SUE:'SUSAN',TRISH:'PATRICIA',GABE:'GABRIEL',ZACH:'ZACHARY',JOE:'JOSEPH',RICK:'RICHARD',RICH:'RICHARD',RON:'RONALD',GREG:'GREGORY',JON:'JONATHAN',NATE:'NATHAN',CHARLIE:'CHARLES',ABBY:'ABIGAIL',MANNY:'MANUEL'};
const LT = s => String(s ?? '').toUpperCase().replace(/[^A-Z]/g, '');
const titleCase = s => String(s ?? '').trim().split(/\s+/).map(w => w === w.toLowerCase() || w === w.toUpperCase() ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : w).join(' ');
function dirRole(t){ t = String(t || '').toLowerCase(); if (/physician|medical director|medical officer|psychiatrist|\bmd\b/.test(t) && !/nurse/.test(t)) return 'Physician'; if (/pmhnp|nurse practitioner|\bnp\b/.test(t)) return 'Nurse Practitioner'; if (/therap/.test(t)) return 'Therapist'; if (/\brn\b|registered nurse/.test(t)) return 'RN'; return ''; }

function firstOk(F, toks){ F = LT(F); return toks.some(t => { t = LT(t); return t && F && (t === F || t.startsWith(F) || F.startsWith(t) || t.slice(0, 3) === F.slice(0, 3) || NICK[F] === t || NICK[t] === F); }); }
function dirMatch(irName){
  const dir = S.cfg.dir || []; const toks = String(irName || '').toUpperCase().replace(CREDS, '').replace(',', ' ').trim().split(/\s+/); const res = [];
  for (const d of dir){ const last = LT(d.last); if (!last) continue; for (let k = 1; k < toks.length; k++) if (LT(toks.slice(0, k).join('')) === last){ res.push([d, firstOk(d.first, toks.slice(k))]); break; } }
  const act = a => a.sort((x, y) => (x[0].status === 'ACTIVE' ? 0 : 1) - (y[0].status === 'ACTIVE' ? 0 : 1));
  const strong = act(res.filter(x => x[1]));
  if (strong.length) return { d: strong[0][0], note: '' };
  if (toks.length >= 2){ const key = LT(toks[1].charAt(0) + toks[0]); const em = dir.filter(d => LT(String(d.email).split('@')[0]) === key); if (em.length === 1) return { d: em[0], note: 'matched by email address, please confirm' }; }

async function importDirectory(file){

    await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const v = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
    const hi = findHeader(v, ['first name', 'last name', 'work email']); if (hi < 0) throw new Error('That file needs First name, Last name and Work email columns.');
    const H = v[hi].map(norm); const ix = n => H.indexOf(n);
    const iF = ix('first name'), iL = ix('last name'), iE = ix('work email'), iT = ix('title'), iG = ix('location'), iR = ix('region'), iS = ix('employee status');
    const dir = [];
    for (const r of v.slice(hi + 1)){
      const title = iT >= 0 ? r[iT] : '', region = iR >= 0 ? r[iR] : '';
      if (!(/clinician|clincian/i.test(region) || /regional medical director|chief medical officer/i.test(title))) continue; // providers only
      dir.push({ first: String(r[iF]).trim(), last: String(r[iL]).trim(), email: String(r[iE]).trim(), title: String(title).trim(), loc: iG >= 0 ? String(r[iG]).trim() : '', status: iS >= 0 ? String(r[iS]).trim().toUpperCase() : '', role: dirRole(title) });
    }
    if (!dir.length) throw new Error('No providers found (Region = Clinicians) in that file.');
    S.cfg.dir = dir; S.cfg.dirAt = new Date().toISOString(); S.cfg.dirName = file.name;
    const n = applyDirectory(); await saveCfg(); busy(false); render();
    toast('ok', `${dir.length} providers loaded. ${n.filled} portal providers filled in${n.check ? `, ${n.check} to confirm` : ''}${n.none ? `, ${n.none} not found` : ''}.`);
  } catch (e){ busy(false); toast('bad', esc(e.message || e)); console.error(e); }
}

function applyDirectory(){

function provEmail(p){

async function copyRich(html, text){
  try { if (window.ClipboardItem && navigator.clipboard?.write){ await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })]); return true; } } catch {}
  try { const d = document.createElement('div'); d.contentEditable = 'true'; d.style.cssText = 'position:fixed;left:-9999px;top:0'; d.innerHTML = html; document.body.appendChild(d); const rg = document.createRange(); rg.selectNodeContents(d); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg); const ok = document.execCommand('copy'); sl.removeAllRanges(); d.remove(); if (ok) return true; } catch {}
  try { await navigator.clipboard.writeText(text); return true; } catch { return false; }
}

  [/^\W*ER\s*\/\s*HIM\s*\/\s*NB\s*\/\s*Auth/i, null],
  [/^\W*ER\s*\/\s*HIM\s*\/\s*NB\s*\/\s*Missing\s*Demo/i, 'ER/HIM/NB/Missing Demo'],

  [/^\W*ER\s*\/\s*HIM\s*\/\s*NB\s*\/\s*Missing\s*\/?\s*Non[\s-]*Covered\s*Dx/i, 'ER/HIM/NB/Missing / Non-Covered Dx'],

// renamed descriptions: { originalName: newName }, applied wherever a description is shown, counted or written
function dispCat(c){ const m = (S.cfg && S.cfg.rename) || {}; let x = c, n = 0; while (m[x] && m[x] !== x && n++ < 8) x = m[x]; return x; }
const ocKey = d => String(d ?? '').replace(/\s+/g, ' ').trim().slice(0, 80);
function classifyIR(desc){ const c = classifyIR0(desc); if (c.cat) c.cat = dispCat(c.cat); if (c.key) c.key = c.key; return c; }
function classifyIR0(desc){
  const d = String(desc ?? ''); const t = d.trim().replace(/\.$/, '');
  if (Object.values((S.cfg && S.cfg.rename) || {}).includes(t)) return { ctrl: true, cat: t }; // already renamed (e.g. read back from a Filtered tab)
  if (IR_CATS.includes(t)) return { ctrl: true, cat: t };
  if (t === AUTH_CAT) return { ctrl: false, cat: AUTH_CAT };
  for (const [re, cat] of IR_RULES) if (re.test(d)) return cat ? { ctrl: true, cat } : { ctrl: false, cat: AUTH_CAT };
  const dec = (S.cfg.irDecide || {})[ocKey(d)];
  if (!dec) return { outlier: true, key: ocKey(d) };
  if (dec.act === 'exclude') return { ctrl: false, cat: ocKey(d) };
  return { ctrl: true, cat: dec.act === 'map' ? dec.cat : ocKey(d) }; // dispCat applied by classifyIR
}

async function scanSources(){

// ----- IR: raw tab -> classified rows -----
async function readIR(part){
  const src = S.rep.ir[part]; const values = await S.store.readSheet(src.sheet);
  const hi = findHeader(values, ['incident id', 'description', 'facility']);
  const hdrRaw = values[hi]; let a = 0, b = hdrRaw.length - 1;
  while (a < b && ['', 'status', 'notes'].includes(norm(hdrRaw[a]))) a++;
  while (b > a && String(hdrRaw[b] ?? '').trim() === '') b--;
  const header = hdrRaw.slice(a, b + 1).map(x => String(x).trim());
  const H = header.map(norm); const iD = H.indexOf('description'), iF = H.indexOf('facility');
  const rows = [];
  for (let r = hi + 1; r < values.length; r++){
    const v = values[r].slice(a, b + 1); if (!v.some(x => x !== '' && x !== null)) continue;
    rows.push({ v, desc: v[iD], fac: normLoc(v[iF]) });
  }
  return { header, rows, iD, iF };
}
function classifyAll(data){

  return [...unknown.values()];
}

const PV = { tbl: 'border-collapse:collapse;font-family:Aptos,Calibri,Segoe UI,Arial,sans-serif;font-size:13px;margin:8px 0 16px', th: 'background:#DDEBF7;font-weight:700;text-align:left;padding:4px 10px;border-bottom:1px solid #9BC2E6;vertical-align:bottom', thn: 'background:#DDEBF7;font-weight:700;text-align:right;padding:4px 10px;border-bottom:1px solid #9BC2E6;vertical-align:bottom', td: 'padding:2px 10px', tdn: 'padding:2px 10px;text-align:right', grp: 'padding:3px 10px;font-weight:700;border-top:1px solid #9BC2E6', grpn: 'padding:3px 10px;font-weight:700;text-align:right;border-top:1px solid #9BC2E6', tot: 'padding:4px 10px;font-weight:700;background:#DDEBF7;border-top:2px solid #9BC2E6', totn: 'padding:4px 10px;font-weight:700;text-align:right;background:#DDEBF7;border-top:2px solid #9BC2E6' };

// compact email tables: totals by description, then one row per clinic with the main categories as columns
const shortCat = c => { const t = String(c).replace(/^ER\/HIM\/NB\//i, '').replace(/\s*\/\s*/g, ' / ').trim(); return t.length > 38 ? t.slice(0, 36) + '…' : t; };
function pivotTables(cur, base){
  const cmp = !!base; const g = (m, k) => (m && m.get(k)) || 0;
  const F = 'font-family:Aptos,Calibri,Segoe UI,Arial,sans-serif;font-size:12px;color:#222';
  const TB = `border-collapse:collapse;${F};margin:6px 0 14px`;
  const H = 'background:#DDEBF7;font-weight:700;padding:3px 8px;border-bottom:1px solid #9BC2E6;white-space:nowrap', HR = H + ';text-align:right';
  const D = 'padding:2px 8px;border-bottom:1px solid #eef2f7;white-space:nowrap', DR = D + ';text-align:right';
  const T = 'padding:3px 8px;font-weight:700;background:#DDEBF7;border-top:1px solid #9BC2E6;white-space:nowrap', TR = T + ';text-align:right';
  const delta = (now, before, small) => { const d = now - before; if (!d) return small ? '' : '<span style="color:#888">–</span>'; const c = d > 0 ? '#b3261e' : '#2f7a45'; return small ? ` <span style="color:${c};font-size:11px">(${d > 0 ? '▲' : '▼'}${Math.abs(d)})</span>` : `<span style="color:${c};font-weight:700">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}</span>`; };
  const dt = (now, before) => { const d = now - before; return d ? (d > 0 ? '▲' : '▼') + Math.abs(d) : '–'; };
  // 1) by description
  const descs = [...new Set([...cur.byDesc.keys(), ...(cmp ? base.byDesc.keys() : [])])].sort((a, b) => g(cur.byDesc, b) - g(cur.byDesc, a) || byName(a, b));
  let h1 = `<table style="${TB}"><tr><th style="${H};text-align:left">Description</th>${cmp ? `<th style="${HR}">AM</th><th style="${HR}">EOD</th><th style="${HR}">Difference</th>` : `<th style="${HR}">Items</th>`}</tr>`;
  let t1 = cmp ? 'Description\tAM\tEOD\tDifference\n' : 'Description\tItems\n';
  for (const d of descs){ const n = g(cur.byDesc, d), b = cmp ? g(base.byDesc, d) : 0; h1 += `<tr><td style="${D}">${esc(shortCat(d))}</td>${cmp ? `<td style="${DR}">${b}</td><td style="${DR}">${n}</td><td style="${DR}">${delta(n, b)}</td>` : `<td style="${DR}">${n}</td>`}</tr>`; t1 += `${shortCat(d)}\t${cmp ? b + '\t' + n + '\t' + dt(n, b) : n}\n`; }
  h1 += `<tr><td style="${T}">Total</td>${cmp ? `<td style="${TR}">${base.total}</td><td style="${TR}">${cur.total}</td><td style="${TR}">${delta(cur.total, base.total)}</td>` : `<td style="${TR}">${cur.total}</td>`}</tr></table>`;
  t1 += `Total\t${cmp ? base.total + '\t' + cur.total + '\t' + dt(cur.total, base.total) : cur.total}`;
  // 2) one row per clinic: the three biggest categories as columns, everything else in Other
  const top = descs.slice(0, 3); const other = (m) => m ? [...m.entries()].filter(([k]) => !top.includes(k)).reduce((a, [, v]) => a + v, 0) : 0;
  const tot = (c, l) => c && c.byLoc.get(l) ? [...c.byLoc.get(l).values()].reduce((a, b) => a + b, 0) : 0;
  const locs = [...new Set([...cur.byLoc.keys(), ...(cmp ? base.byLoc.keys() : [])])].sort((a, b) => tot(cur, b) - tot(cur, a) || tot(base, b) - tot(base, a) || byName(a, b));
  let h2 = `<table style="${TB}"><tr><th style="${H};text-align:left">Clinic</th>${top.map(d => `<th style="${HR}">${esc(shortCat(d))}</th>`).join('')}<th style="${HR}">Other</th>${cmp ? `<th style="${HR}">AM</th><th style="${HR}">EOD</th><th style="${HR}">Difference</th>` : `<th style="${HR}">Total</th>`}</tr>`;
  let t2 = `Clinic\t${top.map(shortCat).join('\t')}\tOther\t${cmp ? 'AM\tEOD\tDifference' : 'Total'}\n`;
  for (const l of locs){
    const cm = cur.byLoc.get(l), bm = cmp ? base.byLoc.get(l) : null;
    const cells = top.map(d => { const n = g(cm, d), b = g(bm, d); return `<td style="${DR}">${n || (cmp && b ? 0 : '<span style="color:#bbb">·</span>')}${cmp ? delta(n, b, true) : ''}</td>`; }).join('');
    const on = other(cm), ob = other(bm);
    h2 += `<tr><td style="${D};font-weight:600">${esc(l)}</td>${cells}<td style="${DR}">${on || (cmp && ob ? 0 : '<span style="color:#bbb">·</span>')}${cmp ? delta(on, ob, true) : ''}</td>${cmp ? `<td style="${DR}">${tot(base, l)}</td><td style="${DR};font-weight:700">${tot(cur, l)}</td><td style="${DR}">${delta(tot(cur, l), tot(base, l))}</td>` : `<td style="${DR};font-weight:700">${tot(cur, l)}</td>`}</tr>`;
    t2 += `${l}\t${top.map(d => g(cm, d)).join('\t')}\t${on}\t${cmp ? tot(base, l) + '\t' + tot(cur, l) + '\t' + dt(tot(cur, l), tot(base, l)) : tot(cur, l)}\n`;
  }
  const cTop = top.map(d => g(cur.byDesc, d)), cOther = cur.total - cTop.reduce((a, b) => a + b, 0);

  t2 += `Total\t${cTop.join('\t')}\t${cOther}\t${cmp ? base.total + '\t' + cur.total + '\t' + dt(cur.total, base.total) : cur.total}`;
  return { html: h1 + h2, text: t1 + '\n\n' + t2 };
}

const hIdx = (H, ...names) => { for (const n of names){ const i = H.indexOf(n); if (i >= 0) return i; } return -1; };
async function readER(){
  const values = await S.store.readSheet(S.rep.er.sheet);
  const hi = findHeader(values, ['incidentid', 'erstatus', 'note category']);
  let header = values[hi].map(x => String(x ?? '').trim()); let last = header.length - 1; while (last > 0 && !header[last]) last--; header = header.slice(0, last + 1);
  const H = header.map(norm);

  const rows = [];
  for (let r = hi + 1; r < values.length; r++){
    const v = values[r].slice(0, header.length); if (!v.some(x => x !== '' && x !== null)) continue;
    const rt = (ix.rt >= 0 && String(v[ix.rt] ?? '').trim()) || revType(ix.cpt >= 0 ? v[ix.cpt] : '');
    const d = ix.dos >= 0 ? toDate(v[ix.dos]) : null;

}

      ${R.er ? `<div class="srow" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div class="grow"><div class="name">${esc(R.er.sheet)} tab</div><div class="small muted">${R.er.rows.toLocaleString()} rows${R.has('Filtered Export') ? ' · Filtered Export built' : ''}</div></div>
        <button class="btn sm primary" data-act="buildER">${R.has('Filtered Export') ? 'Rebuild' : 'Build'} Filtered Export + summary + email</button>${R.has('Filtered Export') ? '<button class="btn sm" data-act="erEmail">Email only</button>' : ''}</div>
        <div class="small muted" style="margin-top:8px">Keeps open "Auth Missing/Expired" items with revenue type ${erKeep().map(esc).join(', ')} (non-interventional). Revenue type comes from the first CPT code when the export doesn't have it.</div>` : '<div class="empty">No ER export tab in this workbook. Open the Monday ER report to use this.</div>'}</div>
    <div class="card"><h2>How items are classified</h2>
      <div class="small">Not controllable: every <b>ER/HIM/NB/Authorization…</b> item. Controllable, shortened to: ${IR_CATS.map(c => `<button class="pill" style="margin:2px;cursor:pointer" data-act="renameCat" data-c="${esc(dispCat(c))}" title="Rename">${esc(dispCat(c))} ✎</button>`).join('')}</div>
      ${Object.keys(S.cfg.rename || {}).length ? `<h3>Renamed</h3><table class="set"><tbody>${Object.entries(S.cfg.rename).map(([a, b]) => `<tr><td>${esc(a)}</td><td>→ ${esc(b)}</td><td><button class="linkbtn" data-act="unrename" data-k="${esc(a)}">Undo</button></td></tr>`).join('')}</tbody></table>` : ''}
      <h3>Your decisions on other descriptions</h3>
      ${dec.length ? `<table class="set"><tbody>${dec.map(([k, d]) => `<tr><td style="word-break:break-word">${esc(k)}</td><td>${d.act === 'exclude' ? 'Not controllable' : d.act === 'map' ? 'Counts as ' + esc(d.cat) : 'Own line'}</td><td><button class="linkbtn" data-act="ocForget" data-k="${esc(k)}">Forget</button></td></tr>`).join('')}</tbody></table>` : '<div class="small muted">None yet. You\'ll be asked the first time a new description shows up.</div>'}</div>`;
}

// ---------- install page / manifest ----------
function notInExcelHTML(){
  return `<main style="max-width:640px"><div class="card"><h2><span class="brand" style="flex:0"><span class="dot">IR</span></span> IR Portal Tracker</h2>
    <p>This page is an Excel add-in. It runs inside the IR Portal workbook and reads its Filtered tab.</p>
    <h3>Install it (once)</h3>
    <ol><li>Click <b>Download manifest</b> below. It's set up for this web address.</li>
      <li>Open the workbook in Excel on the web → <b>Home → Add-ins → More Add-ins → My Add-ins → Upload My Add-in</b>, and choose the file.</li>
      <li>An <b>IR Portal Tracker</b> button appears on the Home tab.</li></ol>
    <div class="row"><button class="btn primary" data-act="dlManifest">Download manifest</button><button class="btn" data-act="demo">Try the demo</button></div>
    <div class="small muted" style="margin-top:10px">Patient data stays in the workbook. This site only serves the app's code.</div></div></main>`;
}
function downloadManifest(){
  const base = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, ''); const host = new URL(base).origin;
  const x = MANIFEST.replaceAll('__BASE__', base.replace(/\/$/, '')).replaceAll('__HOST__', host);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([x], { type: 'application/xml' })); a.download = 'ir-portal-tracker-manifest.xml'; a.click();
}
const MANIFEST = `__MANIFEST__`;

// ---------- full screen: an Office dialog; the pane stays open and does the Excel work ----------
const CH = 12000;
function sendChunks(fn, obj){ const s = JSON.stringify(obj); const id = Math.random().toString(36).slice(2); const n = Math.max(1, Math.ceil(s.length / CH)); for (let i = 0; i < n; i++) fn(JSON.stringify({ c: id, i, n, d: s.slice(i * CH, (i + 1) * CH) })); }
function makeRx(handler){ const buf = {}; return str => { let m; try { m = JSON.parse(str); } catch { return; } if (!m || !m.c) return; const b = buf[m.c] || (buf[m.c] = []); b[m.i] = m.d; if (b.filter(x => x != null).length === m.n){ delete buf[m.c]; try { handler(JSON.parse(b.join(''))); } catch (e){ console.error(e); } } }; }
function RemoteStore(){
  const pend = new Map(); let docs = {}; let onChanged = null;
  const rx = makeRx(m => { if (m.rid && pend.has(m.rid)){ const p = pend.get(m.rid); pend.delete(m.rid); m.ok ? p.res(m.res) : p.rej(new Error(m.err)); } else if (m.ev === 'changed' && onChanged) onChanged(); });
  Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, a => rx(a.message));
  const up = obj => sendChunks(s => Office.context.ui.messageParent(s), obj);
  const call = (op, args) => new Promise((res, rej) => { const rid = Math.random().toString(36).slice(2); pend.set(rid, { res, rej }); up({ rid, op, args }); setTimeout(() => { if (pend.has(rid)){ pend.delete(rid); rej(new Error('Excel didn\'t answer. Keep the IR Portal Tracker panel open behind this window, then try again.')); } }, 45000); });
  S.closeFull = () => up({ ev: 'close' });
  return {
    live: true, remote: true,
    async load(){ const d = await call('load'); docs = d.docs || {}; return d; },
    getDoc: k => docs[k] ?? null,
    async setDoc(k, v){ docs[k] = v; await call('setDoc', [k, v]); },
    sheetsInfo: () => call('sheetsInfo', []), readSheet: n => call('readSheet', [n]), removeSheets: ns => call('removeSheets', [ns]),
    writeSheet: (n, v, o) => call('writeSheet', [n, v, o]), writeCells: (n, c, k) => call('writeCells', [n, c, k]), renameSheet: (a, b) => call('renameSheet', [a, b]), refreshPivots: () => call('refreshPivots', []), insertCols: (n, k) => call('insertCols', [n, k]), buildPivots: (n, sp, o) => call('buildPivots', [n, sp, o]), activate: n => call('activate', [n]),
    watch(cb){ onChanged = cb; },
  };
}
let DLG = null;
function openFull(){
  if (DLG) return;
  const url = location.href.replace(/[?#].*$/, '') + '?mode=dialog';
  Office.context.ui.displayDialogAsync(url, { height: 96, width: 96, displayInIframe: true }, res => {
    if (res.status !== Office.AsyncResultStatus.Succeeded){ toast('bad', 'Couldn\'t open full screen: ' + esc(res.error?.message || '')); return; }
    DLG = res.value;
    const reply = obj => { try { sendChunks(s => DLG && DLG.messageChild(s), obj); } catch (e){ console.error(e); } };
    const rx = makeRx(async m => {
      if (m.ev === 'close'){ try { DLG.close(); } catch {} DLG = null; loadCfg(); reload(true); return; }
      const { rid, op, args } = m;
      try {
        let res;
        if (op === 'load'){ res = await S.store.load(S.cfg.sheet); res.docs = { irCfg: S.store.getDoc('irCfg'), irSent: S.store.getDoc('irSent'), irBuilt: S.store.getDoc('irBuilt'), irNotes: S.store.getDoc('irNotes') }; }
        else if (['setDoc', 'sheetsInfo', 'readSheet', 'removeSheets', 'writeSheet', 'writeCells', 'insertCols', 'refreshPivots', 'renameSheet', 'buildPivots', 'activate'].includes(op)) res = await S.store[op](...(args || []));
        else throw new Error('Unknown request');
        reply({ rid, ok: true, res: res ?? null });
      } catch (e){ reply({ rid, ok: false, err: e.message || String(e) }); }
    });
    DLG.addEventHandler(Office.EventType.DialogMessageReceived, a => rx(a.message));
    DLG.addEventHandler(Office.EventType.DialogEventReceived, () => { DLG = null; loadCfg(); reload(true); });
    S.notifyDialog = () => reply({ ev: 'changed' });
  });
}

(function boot(){
  const demo = /[?&]demo\b/.test(location.search);
  S.mode = /[?&]mode=dialog\b/.test(location.search) ? 'dialog' : demo ? 'demo' : 'pane';
  const start = store => { S.store = store; reload(true).then(async () => { try { await scanSources(); if ((!S.rows.length || S.loadErr) && (S.rep.ir.AM || S.rep.er)) S.tab = 'rep'; render(); } catch (e){ console.error(e); } }).then(() => store.watch?.(() => { clearTimeout(S._w); S._w = setTimeout(() => { if (DLG && S.notifyDialog){ S.notifyDialog(); return; } if ($('#modal').hidden) reload(true); }, 1500); })); };
  if (S.mode === 'dialog'){ if (typeof Office === 'undefined'){ $('#app').innerHTML = notInExcelHTML(); return; } Office.onReady(() => start(RemoteStore())); return; }
  if (demo){ start(DemoStore()); return; }
  if (typeof Office === 'undefined'){ $('#app').innerHTML = notInExcelHTML(); return; }
  let settled = false;
  Office.onReady(info => { settled = true; if (info.host === Office.HostType.Excel){ try { S.canFull = Office.context.requirements.isSetSupported('DialogApi', '1.2'); } catch { S.canFull = false; } start(OfficeStore()); } else $('#app').innerHTML = notInExcelHTML(); });
  setTimeout(() => { if (!settled) $('#app').innerHTML = notInExcelHTML(); }, 4000);
})();
</script>
